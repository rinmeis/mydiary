   MEMO
══════════════════════════ */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function memoCard(m, i) {
  const checks = m.checks || [];
  const todo = checks.filter(c => !c.done);
  const done = checks.filter(c =>  c.done);
  const checkItem = (c, ci) =>
    `<div class="memo-check-item${c.done?' done':''}" onclick="toggleCheck(${i},${ci})">
      <div class="ci-box"></div><span class="ci-label">${escHtml(c.text)}</span>
    </div>`;
  const todoHtml = todo.length
    ? `<div class="check-group"><div class="check-group-label">未完了 <span>${todo.length}</span></div>
         <div class="memo-checklist">${checks.map((c,ci)=>c.done?'':checkItem(c,ci)).join('')}</div></div>` : '';
  const doneCheckHtml = done.length
    ? `<div class="check-group"><div class="check-group-label done-label">完了済 <span>${done.length}</span></div>
         <div class="memo-checklist">${checks.map((c,ci)=>c.done?checkItem(c,ci):'').join('')}</div></div>` : '';
  return `<div class="memo-card${m.done?' memo-card-done':''}">
    <div class="memo-card-top">
      <button class="memo-done-btn${m.done?' done':''}" onclick="toggleMemoDone(${i})" title="${m.done?'未完了に戻す':'完了にする'}">
        <i class="ti ti-check"></i></button>
      <div class="memo-card-title" style="flex:1;margin:0 8px">${escHtml(m.title||'無題')}</div>
      <button class="memo-card-edit" onclick="openMemoEdit(${i})"><i class="ti ti-edit"></i></button>
      <button class="memo-card-del" onclick="delMemo(${i})"><i class="ti ti-trash"></i></button>
    </div>
    ${m.body?`<div class="memo-card-body">${escHtml(m.body)}</div>`:''}
    ${todoHtml}${doneCheckHtml}
    <div class="check-add-row" style="margin-top:8px">
      <textarea class="check-add-input" rows="1" placeholder="項目を追加…"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){addCheckToMemo(${i},this);event.preventDefault();}"></textarea>
      <button class="check-add-btn" onclick="addCheckToMemo(${i},this.previousElementSibling)"><i class="ti ti-plus"></i></button>
    </div>
    <div class="memo-card-time">${new Date(m.saved).toLocaleDateString('ja-JP',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
  </div>`;
}

function renderMemos() {
  if (!memos.length) {
    document.getElementById('memo-list').innerHTML =
      `<p class="empty-msg">メモがありません<br>右上の「新規」から追加できます</p>`;
    return;
  }
  const active = memos.map((m,i)=>({m,i})).filter(x=>!x.m.done);
  const done   = memos.map((m,i)=>({m,i})).filter(x=> x.m.done);
  let html = '';
  if (active.length) html += active.map(x=>memoCard(x.m,x.i)).join('');
  if (done.length) {
    html += `<div class="memo-section-label done-label"><i class="ti ti-circle-check"></i>完了済 (${done.length})</div>`;
    html += done.map(x=>memoCard(x.m,x.i)).join('');
  }
  document.getElementById('memo-list').innerHTML = html;
}

function toggleMemoDone(i) {
  memos[i].done = !memos[i].done;
  persist();
  renderMemos();
}

function addCheckToMemo(i, input) {
  const text = input.value.trim();
  if (!text) return;
  if (!memos[i].checks) memos[i].checks = [];
  memos[i].checks.push({ text, done: false });
  persist();
  renderMemos();
}

function toggleCheck(memoIdx, checkIdx) {
  memos[memoIdx].checks[checkIdx].done = !memos[memoIdx].checks[checkIdx].done;
  persist();
  renderMemos();
}

function toggleMemoForm() {
  const form = document.getElementById('memo-form');
  const opening = !form.classList.contains('open');
  form.classList.toggle('open');
  if (opening) {
    document.getElementById('memo-title-in').value = '';
    document.getElementById('memo-body-in').value = '';
  }
}

function saveMemo() {
  const t = document.getElementById('memo-title-in').value.trim();
  const b = document.getElementById('memo-body-in').value.trim();
  if (!t && !b) return;
  memos.unshift({ title:t, body:b, checks:[], done:false, saved: new Date().toISOString() });
  persist();
  toggleMemoForm();
  renderMemos();
}

function delMemo(i) {
  if (confirm('このメモを削除しますか？')) { memos.splice(i,1); persist(); renderMemos(); }
}

/* ══════════════════════════
   TASKS (タスク管理 / tasks_ver.1.7.0.js を組み込み)
══════════════════════════ */
/* ============================================================
   tasks_ver.1.7.0.js  ― mydiary タスク管理機能(第4のタブ)
   単体で動作する独立モジュール。mydiary本体にはまだ組み込まれていない。

   使い方:
     Tasks.mount(document.getElementById('screen-tasks'), { storageKey:'md_tasks', lockScroll, unlockScroll });
     Tasks.render();   // タブを開くたびに呼ぶ(日付の区切りを最新にし、チェックして残しておいたタスクを片づける)

   依存: Tabler Icons(ti-*)、本体のCSS変数(--bg,--text,--green,--red 等。無ければ代替色)
   保存: localStorage の storageKey(既定 'md_tasks')。他のデータには触れない。
============================================================ */
const Tasks = (() => {
  'use strict';

  /* ── 定数 ── */
  const REP = { none: 'なし', daily: '毎日', weekly: '毎週', monthly: '毎月' };
  const DOW = ['日', '月', '火', '水', '木', '金', '土'];
  const GROUPS = [
    ['over', '期限超過'], ['today', '今日まで'], ['week', '来週まで'],
    ['month', '今月まで'], ['later', 'それ以降'], ['none', '期限なし']
  ];

  /* ── 状態 ── */
  let root = null;
  let tasks = [];
  let storageKey = 'md_tasks';
  let nowFn = () => new Date();
  let view = 'main';          // 'main' | 'done' | 'nodue'
  let selMode = false;
  let sel = new Set();
  let editingId = null;       // null = 新規
  let form = { hasDue: true, repeat: 'none' };
  let hooks = {};             // 本体のスクロール固定などを呼ぶための任意フック {lock, unlock}
  let held = new Set();       // チェック済みだが、画面を切り替えるまでその場に残すタスクのID

  /* ── 日付ヘルパー ── */
  const p2 = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  const slash = d => d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  const hm = d => d.getHours() + ':' + p2(d.getMinutes());
  const toIso = d => ymd(d) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  const parseIso = s => {
    const [a, b] = s.split('T');
    const [y, m, d] = a.split('-').map(Number);
    const [h, mi] = b.split(':').map(Number);
    return new Date(y, m - 1, d, h, mi);
  };
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, d.getHours(), d.getMinutes());
  const daysInMonth = (y, mIdx) => new Date(y, mIdx + 1, 0).getDate();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* ── 保存 ── */
  function load() {
    try {
      const a = JSON.parse(localStorage.getItem(storageKey) || '[]');
      tasks = Array.isArray(a) ? a : [];
    } catch (e) { tasks = []; }
  }
  function save() {
    try { localStorage.setItem(storageKey, JSON.stringify(tasks)); } catch (e) {}
  }

  /* ── 繰り返し ── */
  function stepDue(d, rep, anchorDay) {
    if (rep === 'daily') return addDays(d, 1);
    if (rep === 'weekly') return addDays(d, 7);
    const mIdx = d.getMonth() + 1;            // 翌月(年またぎはDateが処理)
    const y = d.getFullYear() + (mIdx > 11 ? 1 : 0);
    const mm = mIdx % 12;
    const day = Math.min(anchorDay, daysInMonth(y, mm));
    return new Date(y, mm, day, d.getHours(), d.getMinutes());
  }
  /* 元の期限の次の周期。すでに過ぎていたら「今より後の最初の周期」 */
  function nextDue(t, now) {
    let d = parseIso(t.due);
    let n = stepDue(d, t.repeat, t.anchorDay);
    let guard = 0;
    while (n <= now && guard++ < 5000) n = stepDue(n, t.repeat, t.anchorDay);
    return n;
  }

  /* ── 区分け ── */
  function groupInfo(now) {
    const today = startOfDay(now);
    const wk = addDays(today, 7);
    const mEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    const showMonth = wk.getMonth() === today.getMonth();   // 来週が来月なら「今月まで」を省略
    return { today, wk, mEnd, showMonth };
  }
  function groupOf(t, now, gi) {
    if (!t.due) return 'none';
    const d = parseIso(t.due);
    if (d < now) return 'over';
    const dDay = startOfDay(d);
    if (+dDay === +gi.today) return 'today';
    if (dDay <= gi.wk) return 'week';
    if (gi.showMonth && dDay <= gi.mEnd) return 'month';
    return 'later';
  }
  function groupLabel(key, gi) {
    const base = GROUPS.find(g => g[0] === key)[1];
    if (key === 'today') return base + ' (' + slash(gi.today) + ')';
    if (key === 'week') return base + ' (' + slash(gi.wk) + ')';
    if (key === 'month') return base + ' (' + slash(gi.mEnd) + ')';
    return base;
  }

  /* ── 操作 ── */
  function complete(id) {
    const t = tasks.find(x => x.id === id);
    if (!t || t.done) return;
    const now = nowFn();
    t.done = true;
    t.doneAt = now.getTime();
    if (t.repeat !== 'none' && t.due) {
      const n = {
        id: uid(), title: t.title, due: toIso(nextDue(t, now)), repeat: t.repeat,
        anchorDay: t.anchorDay, done: false, doneAt: null, nextId: null, createdAt: now.getTime()
      };
      tasks.push(n);
      t.nextId = n.id;
    }
    save();
  }
  function restore(id) {
    const t = tasks.find(x => x.id === id);
    if (!t || !t.done) return;
    if (t.nextId) {
      const n = tasks.find(x => x.id === t.nextId);
      if (n && !n.done) {
        tasks = tasks.filter(x => x.id !== n.id);          // 自動追加された次の回を消す
      } else if (n && n.done) {
        t.repeat = 'none';                                  // 続きが進んでいるので単発として戻す
      }                                                     // n が無い(削除済み)なら繰り返しありで戻す
    }
    t.done = false; t.doneAt = null; t.nextId = null;
    save();
  }
  function removeIds(ids) {
    const s = new Set(ids);
    tasks = tasks.filter(x => !s.has(x.id));
    save();
  }

  /* ── 描画 ── */
  function repBadge(t) {
    return t.repeat !== 'none' ? '<span class="tk-rp"><i class="ti ti-repeat" aria-hidden="true"></i>' + REP[t.repeat] + '</span>' : '';
  }
  /* 保留中(held)タスクの「次の回」は、画面を切り替えるまで表示しない */
  function hiddenIds() {
    const h = new Set();
    tasks.forEach(t => { if (held.has(t.id) && t.nextId) h.add(t.nextId); });
    return h;
  }
  function shownTasks() {
    const hid = hiddenIds();
    return tasks.filter(t => (!t.done || held.has(t.id)) && !hid.has(t.id));
  }

  function rowMain(t, key) {
    let sub = '';
    if (t.due) {
      const d = parseIso(t.due);
      sub = key === 'today' ? hm(d) : slash(d) + ' ' + hm(d);
    }
    const isHeld = held.has(t.id);
    return '<div class="tk-row">' +
      '<button class="tk-chk' + (isHeld ? ' on' : '') + '" data-act="' + (isHeld ? 'uncheck' : 'check') + '" data-id="' + t.id + '" aria-label="' + (isHeld ? '未完了に戻す' : '完了にする') + '">' +
      (isHeld ? '<i class="ti ti-check" aria-hidden="true"></i>' : '') + '</button>' +
      '<div class="tk-body"' + (isHeld ? '' : ' data-act="edit" data-id="' + t.id + '"') + '>' +
      '<div class="tk-tt' + (isHeld ? ' s' : '') + '">' + esc(t.title) + repBadge(t) + '</div>' +
      (sub ? '<div class="tk-dl' + (key === 'over' ? ' red' : '') + '">' + sub + '</div>' : '') +
      '</div></div>';
  }
  function renderMain() {
    const now = nowFn();
    const gi = groupInfo(now);
    const shown = shownTasks();
    const doneN = tasks.filter(t => t.done).length;
    const noDueN = tasks.filter(t => !t.done && !t.due).length;
    const buckets = {};
    shown.forEach(t => { (buckets[groupOf(t, now, gi)] = buckets[groupOf(t, now, gi)] || []).push(t); });
    let h = '<div class="tk-toolbar">' +
      '<button class="tk-tbtn hl" data-act="open-nodue">' +
      '<i class="ti ti-infinity" aria-hidden="true"></i>期限なし(' + noDueN + ')' +
      '<i class="ti ti-chevron-right" aria-hidden="true"></i></button>' +
      '<button class="tk-tbtn" data-act="open-done">' +
      '<i class="ti ti-circle-check" aria-hidden="true"></i>完了済み(' + doneN + ')' +
      '<i class="ti ti-chevron-right" aria-hidden="true"></i></button></div>';
    let any = false;
    GROUPS.forEach(([key]) => {
      if (key === 'none') return;                     // 期限なしは専用画面に表示
      const list = buckets[key];
      if (!list || !list.length) return;
      any = true;
      list.sort((a, b) => (parseIso(a.due) - parseIso(b.due)) || (a.createdAt - b.createdAt));
      h += '<div class="tk-pillw"><span class="tk-pill' + (key === 'over' ? ' red' : '') + '">' + groupLabel(key, gi) + '</span></div>';
      h += list.map(t => rowMain(t, key)).join('');
    });
    if (!any) {
      h += '<div class="tk-empty"><i class="ti ti-checkbox" aria-hidden="true"></i>' +
        '<div class="tk-empty-t">' + (shown.length ? '期限つきのタスクはありません' : doneN ? 'すべて完了しました' : 'タスクはまだありません') + '</div>' +
        '<div class="tk-empty-s">右下の＋から追加できます。</div></div>';
    }
    root.querySelector('#tk-list').innerHTML = h;
  }

  function renderNodue() {
    const list = shownTasks().filter(t => !t.due).sort((a, b) => a.createdAt - b.createdAt);
    let h = list.map(t => rowMain(t, 'none')).join('');
    if (!list.length) {
      h = '<div class="tk-empty"><i class="ti ti-infinity" aria-hidden="true"></i>' +
        '<div class="tk-empty-t">期限なしのタスクはありません</div>' +
        '<div class="tk-empty-s">右下の＋から追加できます。</div></div>';
    } else {
      h += '<div class="tk-empty-s tk-foot">期限を決めていないタスクです。追加した順に並びます。</div>';
    }
    root.querySelector('#tk-nodue-list').innerHTML = h;
  }

  function renderDone() {
    const done = tasks.filter(t => t.done).sort((a, b) => b.doneAt - a.doneAt);
    if (!done.length && selMode) { selMode = false; sel.clear(); }
    const head = root.querySelector('#tk-done-head');
    head.querySelector('[data-act="toggle-select"]').textContent = selMode ? 'キャンセル' : '選択';
    head.querySelector('[data-act="toggle-select"]').style.visibility = done.length ? 'visible' : 'hidden';
    let h = '';
    let lastDay = null;
    done.forEach(t => {
      const day = slash(new Date(t.doneAt));
      if (day !== lastDay) { h += '<div class="tk-pillw"><span class="tk-pill">' + day + '</span></div>'; lastDay = day; }
      const checked = sel.has(t.id);
      const subTxt = t.due ? '期限 ' + slash(parseIso(t.due)) + ' ' + hm(parseIso(t.due)) : '期限なし';
      h += '<div class="tk-row" ' + (selMode ? 'data-act="toggle-sel" data-id="' + t.id + '"' : '') + '>' +
        (selMode
          ? '<span class="tk-chk sq' + (checked ? ' on dark' : '') + '">' + (checked ? '<i class="ti ti-check" aria-hidden="true"></i>' : '') + '</span>'
          : '<button class="tk-chk on" data-act="restore" data-id="' + t.id + '" aria-label="未完了に戻す"><i class="ti ti-check" aria-hidden="true"></i></button>') +
        '<div class="tk-body"><div class="tk-tt s">' + esc(t.title) + repBadge(t) + '</div>' +
        '<div class="tk-dl">' + subTxt + '</div></div></div>';
    });
    if (!done.length) {
      h = '<div class="tk-empty"><i class="ti ti-circle-check" aria-hidden="true"></i>' +
        '<div class="tk-empty-t">完了したタスクはありません</div>' +
        '<div class="tk-empty-s">チェックを付けたタスクがここに並びます。</div></div>';
    }
    root.querySelector('#tk-done-list').innerHTML = h;
    const bar = root.querySelector('#tk-bar');
    bar.classList.toggle('show', selMode);
    const allSel = done.length > 0 && sel.size === done.length;
    bar.querySelector('[data-act="sel-all"]').textContent = allSel ? '全解除' : '全選択';
    const delBtn = bar.querySelector('[data-act="del-sel"]');
    delBtn.textContent = '選択を削除(' + sel.size + ')';
    delBtn.classList.toggle('dim', sel.size === 0);
    root.querySelector('#tk-done-list').classList.toggle('with-bar', selMode);
  }

  function refresh() {
    if (!root) return;
    root.classList.toggle('tk-view-done', view === 'done');
    root.classList.toggle('tk-view-nodue', view === 'nodue');
    renderMain();
    renderNodue();
    renderDone();
  }

  /* ── 追加・編集シート ── */
  function defaultDue() {
    const n = nowFn();
    const d = new Date(n.getFullYear(), n.getMonth(), n.getDate(), n.getHours() + 1, 0);
    return d;
  }
  function openSheet(id, opts) {
    editingId = id || null;
    const t = id ? tasks.find(x => x.id === id) : null;
    const d = t && t.due ? parseIso(t.due) : defaultDue();
    form.hasDue = t ? !!t.due : !(opts && opts.noDue);   // 期限なし画面からの追加は期限OFFで開く
    form.repeat = t ? t.repeat : 'none';
    q('#tk-f-title').value = t ? t.title : '';
    q('#tk-f-date').value = ymd(d);
    q('#tk-f-time').value = p2(d.getHours()) + ':' + p2(d.getMinutes());
    q('#tk-sheet-title').textContent = t ? 'タスクを編集' : 'タスクを追加';
    q('#tk-err').textContent = '';
    q('[data-act="sheet-delete"]').style.display = t ? '' : 'none';
    q('[data-act="sheet-save"]').textContent = t ? '保存' : '追加';
    syncForm();
    q('#tk-modal').classList.add('open');
    if (hooks.lock) hooks.lock();
    if (!t) setTimeout(() => q('#tk-f-title').focus(), 120);
  }
  function closeSheet() {
    q('#tk-modal').classList.remove('open'); editingId = null;
    if (hooks.unlock) hooks.unlock();
  }
  function syncForm() {
    q('#tk-sw').classList.toggle('on', form.hasDue);
    q('#tk-due-box').style.display = form.hasDue ? '' : 'none';
    root.querySelectorAll('#tk-seg [data-rep]').forEach(b => b.classList.toggle('on', b.dataset.rep === form.repeat));
    let hint = '';
    const ds = q('#tk-f-date').value;
    if (form.hasDue && ds && form.repeat !== 'none') {
      const [y, m, dd] = ds.split('-').map(Number);
      const d = new Date(y, m - 1, dd);
      if (form.repeat === 'daily') hint = '毎日繰り返します';
      if (form.repeat === 'weekly') hint = '毎週' + DOW[d.getDay()] + '曜に繰り返します';
      if (form.repeat === 'monthly') hint = '毎月' + dd + '日に繰り返します' + (dd > 28 ? '(日数が足りない月は月末)' : '');
    }
    q('#tk-hint').textContent = hint;
  }
  function saveSheet() {
    const title = q('#tk-f-title').value.trim();
    const err = q('#tk-err');
    if (!title) { err.textContent = 'タスク名を入力してください'; q('#tk-f-title').focus(); return; }
    let due = null, repeat = 'none', anchorDay = null;
    if (form.hasDue) {
      const ds = q('#tk-f-date').value, ts = q('#tk-f-time').value;
      if (!ds) { err.textContent = '期限の日付を入力してください'; return; }
      if (!ts) { err.textContent = '期限の時刻を入力してください'; return; }
      due = ds + 'T' + ts;
      repeat = form.repeat;
      anchorDay = Number(ds.split('-')[2]);
    }
    if (editingId) {
      const t = tasks.find(x => x.id === editingId);
      t.title = title; t.due = due; t.repeat = repeat; t.anchorDay = anchorDay;
    } else {
      tasks.push({
        id: uid(), title, due, repeat, anchorDay,
        done: false, doneAt: null, nextId: null, createdAt: nowFn().getTime()
      });
    }
    save();
    closeSheet();
    refresh();
  }
  function deleteFromSheet() {
    const t = tasks.find(x => x.id === editingId);
    if (!t) return;
    const msg = '「' + t.title + '」を削除しますか?' + (t.repeat !== 'none' ? '\n繰り返しも終了します。' : '');
    if (!confirm(msg)) return;
    removeIds([t.id]);
    closeSheet();
    refresh();
  }

  /* ── クリック処理 ── */
  function q(sel) { return root.querySelector(sel); }
  function onClick(e) {
    if (e.target.id === 'tk-modal') { closeSheet(); return; }
    const el = e.target.closest('[data-act]');
    if (!el || !root.contains(el)) return;
    const act = el.dataset.act, id = el.dataset.id;
    switch (act) {
      case 'check':
        complete(id); held.add(id); refresh();       // その場に残す(画面を切り替えるまで)
        break;
      case 'uncheck': restore(id); held.delete(id); refresh(); break;
      case 'edit': openSheet(id); break;
      case 'add': openSheet(null, { noDue: view === 'nodue' }); break;
      case 'open-nodue': held.clear(); view = 'nodue'; refresh(); break;
      case 'open-done': held.clear(); view = 'done'; selMode = false; sel.clear(); refresh(); break;
      case 'back': held.clear(); view = 'main'; selMode = false; sel.clear(); refresh(); break;
      case 'restore': restore(id); refresh(); break;
      case 'toggle-select': selMode = !selMode; sel.clear(); refresh(); break;
      case 'toggle-sel': sel.has(id) ? sel.delete(id) : sel.add(id); renderDone(); break;
      case 'sel-all': {
        const all = tasks.filter(t => t.done).map(t => t.id);
        if (sel.size === all.length) sel.clear(); else all.forEach(i => sel.add(i));
        renderDone(); break;
      }
      case 'del-sel':
        if (!sel.size) return;
        if (!confirm(sel.size + '件の完了済みタスクを削除しますか?')) return;
        removeIds([...sel]); sel.clear(); refresh(); break;
      case 'del-all': {
        const n = tasks.filter(t => t.done).length;
        if (!n) return;
        if (!confirm('完了済みタスク' + n + '件をすべて削除しますか?')) return;
        removeIds(tasks.filter(t => t.done).map(t => t.id)); sel.clear(); refresh(); break;
      }
      case 'sw': form.hasDue = !form.hasDue; syncForm(); break;
      case 'rep': form.repeat = el.dataset.rep; syncForm(); break;
      case 'sheet-cancel': closeSheet(); break;
      case 'sheet-save': saveSheet(); break;
      case 'sheet-delete': deleteFromSheet(); break;
    }
  }

  /* ── DOM / CSS ── */
  const CSS = `
.tk-root{position:relative;flex:1;flex-direction:column;min-height:0;color:var(--text,#1a1a1a);font-family:inherit}
.tk-main,.tk-done,.tk-nodue{flex:1;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tk-main{display:flex;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tk-done,.tk-nodue{display:none}
.tk-root.tk-view-done .tk-main,.tk-root.tk-view-nodue .tk-main{display:none}
.tk-root.tk-view-done .tk-done{display:flex}
.tk-root.tk-view-nodue .tk-nodue{display:flex}
.tk-root.tk-view-done .tk-fab{display:none}
.tk-toolbar{display:flex;justify-content:flex-end;gap:6px;padding:10px 16px 0}
.tk-tbtn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-family:inherit;color:var(--text,#1a1a1a);border:.5px solid var(--border2,rgba(0,0,0,.18));border-radius:16px;padding:5px 10px;background:var(--bg2,#f6f6f2);cursor:pointer}
.tk-tbtn i{font-size:14px}
.tk-tbtn.hl{border-color:var(--text,#1a1a1a)}
.tk-foot{text-align:center;padding:18px 24px calc(96px + env(safe-area-inset-bottom,0px));color:var(--text2,#666)}
.tk-pillw{display:flex;justify-content:center;padding:14px 0 4px}
.tk-pill{font-size:11px;color:#fff;background:#8a8a85;border-radius:12px;padding:3px 12px}
.tk-pill.red{background:var(--red,#e24b4a)}
.tk-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:.5px solid var(--border,rgba(0,0,0,.09))}
.tk-chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--text3,#aaa);background:none;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;padding:0;cursor:pointer;transition:background .15s,border-color .15s}
.tk-chk.on{background:var(--green,#1d9e75);border-color:var(--green,#1d9e75)}
.tk-chk.sq{border-radius:7px}
.tk-chk.sq.on.dark{background:var(--text,#1a1a1a);border-color:var(--text,#1a1a1a)}
.tk-body{flex:1;min-width:0;cursor:pointer}
.tk-tt{font-size:14px;word-break:break-word}
.tk-tt.s{text-decoration:line-through;color:var(--text3,#aaa)}
.tk-dl{font-size:11px;color:var(--text2,#666);margin-top:2px}
.tk-dl.red{color:var(--red,#e24b4a)}
.tk-rp{display:inline-flex;align-items:center;gap:2px;font-size:10px;color:#185FA5;background:#E6F1FB;border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:1px}
.tk-rp i{font-size:11px}
.tk-empty{text-align:center;padding:64px 24px;color:var(--text2,#666)}
.tk-empty i{font-size:36px;color:var(--text3,#aaa)}
.tk-empty-t{font-size:14px;color:var(--text,#1a1a1a);margin-top:8px}
.tk-empty-s{font-size:12px;margin-top:4px}
.tk-fab{position:fixed;right:max(16px,calc(50vw - 199px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:none;background:var(--accent,#1a1a1a);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.25);padding:0}

  /* ── 公開API ── */
  function mount(el, opts) {
    opts = opts || {};
    root = el;
    if (opts.storageKey) storageKey = opts.storageKey;
    if (opts.now) nowFn = opts.now;
    hooks = { lock: opts.lockScroll, unlock: opts.unlockScroll };
    if (!document.getElementById('tk-style')) {
      const st = document.createElement('style');
      st.id = 'tk-style'; st.textContent = CSS;
      document.head.appendChild(st);
    }
    root.classList.add('tk-root');
    root.innerHTML = HTML;
    root.addEventListener('click', onClick);
    q('#tk-f-date').addEventListener('change', syncForm);
    q('#tk-f-title').addEventListener('input', () => { q('#tk-err').textContent = ''; });
    q('#tk-f-title').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveSheet(); } });
    load();
    refresh();
    document.addEventListener('visibilitychange', () => {   // アプリを閉じる/別アプリへ移るときも片づける
      if (document.hidden) { held.clear(); refresh(); }
    });
    setInterval(() => {                                // 日付をまたいだら区切りを更新
      if (view === 'main' && !q('#tk-modal').classList.contains('open') && root.offsetParent !== null) renderMain();
    }, 60000);
  }

  /* カレンダー用: 期限のある未完了タスクを日付ごとにまとめる { 'YYYY-MM-DD': [{id,title,time,overdue}] } */
  function pendingByDate() {
    const now = nowFn();
    const map = {};
    tasks.forEach(t => {
      if (t.done || !t.due) return;
      const k = t.due.slice(0, 10);
      (map[k] = map[k] || []).push({ id: t.id, title: t.title, time: t.due.slice(11, 16), overdue: parseIso(t.due) < now });
    });
    Object.keys(map).forEach(k => map[k].sort((a, b) => a.time < b.time ? -1 : a.time > b.time ? 1 : 0));
    return map;
  }

  /* 公開 render は「画面を切り替えた」扱い: 保留中のチェック済みを片づけ、繰り返しの次の回を出す */
  function render() { held.clear(); refresh(); }

  return {
    mount, render,
    setNow(fn) { nowFn = fn || (() => new Date()); render(); },
    getTasks() { return tasks; },
    pendingByDate,
    setTasks(a) { tasks = a; save(); render(); },
    reload() { load(); render(); }
  };
})();

/* 今日のマスを長押し(0.5秒)すると「本日の予定」のポップアップを開く */
(function() {
  const body = document.getElementById('cal-body-month');
  let timer = null, sx = 0, sy = 0;
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  body.addEventListener('pointerdown', e => {
    if (!e.target.closest('.cal-cell.today')) return;
    sx = e.clientX; sy = e.clientY;
    cancel();
    timer = setTimeout(() => {
      timer = null;
      calSuppressClick = true;
      setTimeout(() => { calSuppressClick = false; }, 600);
      openTodayModal();
    }, 500);
  });
  body.addEventListener('pointermove', e => {
    if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => body.addEventListener(n, cancel));
  body.addEventListener('contextmenu', e => {
    if (e.target.closest('.cal-cell.today')) e.preventDefault();
  });
})();

/* 月表示のセルの高さを測り直す(幅が変わったとき・向きが変わったとき・フォント読み込み後)。
   高さだけの変化(iOSのツールバーの出入り)では測り直さない: スクロール中に表示がずれるため */
let calLastW = window.innerWidth;
window.addEventListener('resize', () => {
  if (window.innerWidth === calLastW) return;
  calLastW = window.innerWidth;
  if (currentView === 'month') renderMonth();
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => { if (currentView === 'month') renderMonth(); }, 300);
});
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { if (currentView === 'month') renderMonth(); });
}

/* ══════════════════════════
   SWIPE NAVIGATION
══════════════════════════ */
(function() {
  let startX = 0, startY = 0;
  const THRESHOLD = 50;
  const calWrap = document.querySelector('.cal-wrap');

  calWrap.addEventListener('touchstart', function(e) {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  calWrap.addEventListener('touchend', function(e) {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < THRESHOLD) return;
    if (Math.abs(dy) > Math.abs(dx)) return;
    if (dx < 0) navFwd();
    else navBack();
  }, { passive: true });
})();
