<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyDiary">
<title>MyDiary</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fff;--bg2:#f6f6f2;--bg3:#eeecea;
  --text:#1a1a1a;--text2:#666;--text3:#aaa;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.18);
  --accent:#1a1a1a;--green:#1d9e75;--red:#e24b4a;--blue:#378add;--task:#534AB7;--today-frame:#7fd99a;
  --r:10px;--rl:16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top:    env(safe-area-inset-top,    0px);
}
/* ── iOS Safari 全般対応 ── */
html{
  height: -webkit-fill-available;   /* 100vh の高さバグ回避 */
  overscroll-behavior: none;        /* バウンススクロール防止 */
}
body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--bg3);color:var(--text);
  min-height:100vh;
  min-height:-webkit-fill-available;
  display:flex;justify-content:center;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;    /* テキスト自動拡大防止 */
}
.app{
  width:100%;max-width:430px;background:var(--bg);
  min-height:100vh;min-height:-webkit-fill-available;
  display:flex;flex-direction:column;
  padding-bottom: var(--safe-bottom); /* ホームバー対応 */
}
/* スクロール領域にモメンタムスクロール付与 */
.diary-screen,.memo-screen,.modal-sheet-inner,
.day-time-grid,.time-grid,#view-month{
  -webkit-overflow-scrolling:touch;
}
/* 全入力欄の共通iOS対応
   font-size:16px → フォーカス時のズーム防止
   appearance:none → iOS独自スタイル除去（既に個別指定済みだがここで統一） */
input,select,textarea{
  font-size:16px;
  -webkit-appearance:none;
  appearance:none;
  border-radius:0; /* iOSのデフォルト角丸除去 */
}

/* ── Header ── */
.header{padding:12px 16px 8px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:20}
.header h1{font-size:17px;font-weight:500}
.header-date{font-size:12px;color:var(--text2)}

/* ── Tab bar ── */
.tabs{display:flex;border-bottom:0.5px solid var(--border);background:var(--bg);position:sticky;top:49px;z-index:20}
.tab{flex:1;padding:9px 4px 7px;text-align:center;font-size:11px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;user-select:none}
.tab i{display:block;font-size:18px;margin-bottom:2px}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}

/* ── Screens ── */
.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex}

/* ══ CALENDAR ══ */
.cal-wrap{display:flex;flex-direction:column;flex:1;overflow:hidden}
.view-switcher{display:flex;gap:8px;margin:10px 16px 0}
.view-btn{width:34px;height:34px;border-radius:50%;font-size:13px;font-weight:500;background:none;border:1.5px solid var(--border2);cursor:pointer;color:var(--text2);font-family:inherit;transition:all .18s;display:flex;align-items:center;justify-content:center;padding:0}
.view-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
.view-btn:active{opacity:.7}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px}
.cal-nav-btn{background:none;border:none;cursor:pointer;color:var(--text);padding:5px 8px;font-size:18px;border-radius:8px}
.cal-nav-btn:active{background:var(--bg2)}
.cal-nav-label{font-size:14px;font-weight:500;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;transition:background .15s}
.cal-nav-label:hover{background:var(--bg2)}
.cal-nav-label:active{background:var(--bg3)}
.cal-nav-label i{font-size:13px;color:var(--text3)}
.add-event-btn{display:flex;align-items:center;gap:4px;padding:6px 11px;border:0.5px solid var(--border2);border-radius:var(--r);background:none;color:var(--text);font-size:12px;cursor:pointer;font-family:inherit}
.add-event-btn:active{background:var(--bg2)}
.cal-actions{display:flex;gap:6px;flex-shrink:0}
.cal-actions .add-event-btn{white-space:nowrap}
@media (max-width:389px){.today-open-btn .btn-lbl{display:none}}

/* ── Monthly ── */
#view-month{padding:0}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:4px}
.cal-dow{font-size:11px;color:var(--text2);padding:3px 0;font-weight:500}
.cal-dow:first-child{color:var(--red)}
.cal-dow:last-child{color:var(--blue)}
.cal-body-month{display:grid;grid-template-columns:repeat(7,1fr);border-left:0.5px solid var(--border);border-top:0.5px solid var(--border)}
.cal-cell{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;height:var(--cal-cell-h,90px);border-radius:0;padding:3px 2px 2px;cursor:pointer;transition:background .15s;overflow:hidden;border-right:0.5px solid var(--border);border-bottom:0.5px solid var(--border)}
/* today panel */
.today-evt-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border)}
.today-evt-item:last-child{border-bottom:none}
.today-evt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.today-evt-info{flex:1;min-width:0}
.today-evt-title{font-size:13px;font-weight:500;overflow:hidden;text-overflow:clip;white-space:nowrap}
.today-evt-time{font-size:11px;color:var(--text2);margin-top:1px}
.today-empty{text-align:center;color:var(--text3);font-size:13px;padding:10px 0}
/* version */
.header-ver{font-size:10px;color:var(--text3);display:block;text-align:right;margin-top:1px}
.cal-cell:active{background:var(--bg2)}
.cal-cell .dnum{font-size:12px;text-align:center;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin:0 auto 2px}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--today-frame)}
.cal-cell.today .dnum{font-weight:500}
.cal-cell.other .dnum{color:var(--text3)}
.cal-cell.sun .dnum{color:var(--red)}
.cal-cell.sat .dnum{color:var(--blue)}
.evt-pill{font-size:9px;line-height:1.3;border-radius:3px;padding:1px 3px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:clip;color:rgba(0,0,0,.7);font-weight:500}
/* タスクの残数・期限の線(カレンダー上) */
.task-badge{position:absolute;right:2px;top:3px;min-width:15px;height:15px;box-sizing:border-box;border-radius:8px;border:1.3px solid var(--task);color:var(--task);background:var(--bg);font-size:9px;line-height:12px;text-align:center;font-weight:500;padding:0 2px;z-index:1}
.task-badge.over{border-color:var(--red);color:var(--red)}
.task-line{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--task);z-index:3;pointer-events:none}
.task-line::before{content:'';position:absolute;left:-1px;top:-5px;width:7px;height:7px;border-radius:50%;background:var(--task)}
.day-task-line{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--task);z-index:4;pointer-events:none}
.day-task-line::before{content:'';position:absolute;left:-1px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--task)}
.day-task-label{position:absolute;right:6px;top:-17px;max-width:75%;font-size:10px;line-height:15px;font-weight:500;color:var(--task);background:var(--bg);padding:0 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.day-task-label.below{top:3px}
/* date jump */
.date-jump-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .15s}
.date-jump-overlay.open{opacity:1;pointer-events:all}
.date-jump-pop{background:var(--bg);border-radius:18px;width:min(300px,calc(100vw - 48px));box-sizing:border-box;overflow:hidden;transform:scale(.95);transition:transform .15s}
.date-jump-inner{padding:22px 18px 18px;box-sizing:border-box}
.date-jump-inner .form-input{width:100%;box-sizing:border-box;max-width:100%}
.date-jump-overlay.open .date-jump-pop{transform:scale(1)}
.date-jump-pop h3{font-size:15px;font-weight:500;margin-bottom:14px}
.date-jump-pop .form-input{margin-bottom:12px}

/* ── Weekly ── */
#view-week{display:none;flex:1;overflow:hidden;flex-direction:column}
#view-week.show{display:flex}
.week-head{display:grid;grid-template-columns:40px repeat(7,1fr);border-bottom:0.5px solid var(--border);padding:0 0 4px;margin:0 4px}
.week-day-col{text-align:center;font-size:11px;color:var(--text2)}
.week-day-col .wdow{font-size:10px;margin-bottom:2px}
.week-day-col .wdnum{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:12px}
.week-day-col.today .wdnum{background:var(--text);color:#fff}
.week-day-col.sun .wdow,.week-day-col.sun .wdnum{color:var(--red)}
.week-day-col.sat .wdow,.week-day-col.sat .wdnum{color:var(--blue)}
.week-day-col.today.sun .wdnum,.week-day-col.today.sat .wdnum{background:var(--text);color:#fff}
.time-grid{flex:1;overflow-y:auto;position:relative;margin:0 4px}
.week-time-row{display:grid;grid-template-columns:40px repeat(7,1fr);min-height:44px;border-bottom:0.5px solid var(--border)}
.time-label{font-size:10px;color:var(--text3);padding:3px 6px 0 0;text-align:right;line-height:1}
.time-cell{border-left:0.5px solid var(--border);position:relative;cursor:pointer}
.time-cell:active{background:var(--bg2)}
.time-evt{position:absolute;left:1px;right:1px;border-radius:4px;padding:2px 3px;font-size:9px;color:rgba(0,0,0,.7);font-weight:500;overflow:hidden;cursor:pointer;z-index:2;line-height:1.3}
.now-line{position:absolute;left:0;right:0;z-index:5;pointer-events:none;display:flex;align-items:center}
.now-line-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;margin-left:-4px}
.now-line-bar{flex:1;height:1.5px;background:var(--red)}
.now-line-time{font-size:9px;color:var(--red);font-weight:500;padding:0 3px;white-space:nowrap}

/* ── Daily ── */
#view-day{display:none;flex:1;overflow:hidden;flex-direction:column}
#view-day.show{display:flex}
.day-head{padding:6px 16px 8px;border-bottom:0.5px solid var(--border)}
.day-head-label{font-size:14px;font-weight:500}
.day-time-grid{flex:1;overflow-y:auto}
.day-row{display:grid;grid-template-columns:44px 1fr;min-height:52px;border-bottom:0.5px solid var(--border)}
.day-time-lbl{font-size:11px;color:var(--text3);padding:4px 8px 0 16px;line-height:1}
.day-slot{border-left:0.5px solid var(--border);position:relative;cursor:pointer;min-height:52px}
.day-slot:active{background:var(--bg2)}
.day-evt{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 7px;font-size:11px;color:rgba(0,0,0,.7);font-weight:500;overflow:hidden;cursor:pointer;z-index:2;line-height:1.4}
.day-now-line{position:absolute;left:0;right:0;z-index:5;pointer-events:none;display:flex;align-items:center}
.day-now-dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex-shrink:0;margin-left:-4px}
.day-now-bar{flex:1;height:1.5px;background:var(--red)}
.day-now-time{font-size:10px;color:var(--red);font-weight:500;padding:0 4px;white-space:nowrap}

/* ══ EVENT MODAL ══ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;touch-action:none}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:430px;box-sizing:border-box;transform:translateY(20px);transition:transform .2s;max-height:92vh;overflow:hidden}
.modal-sheet-inner{padding:20px 16px calc(36px + var(--safe-bottom));overflow-y:auto;overflow-x:hidden;max-height:92vh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-title{font-size:16px;font-weight:500;margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block}
.form-input{width:100%;border:0.5px solid var(--border2);border-radius:var(--r);padding:9px 12px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;box-sizing:border-box;-webkit-appearance:none;appearance:none;display:block}
.form-input:focus{border-color:var(--text)}
.form-select{width:100%;border:0.5px solid var(--border2);border-radius:var(--r);padding:9px 12px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;appearance:none;-webkit-appearance:none;cursor:pointer;box-sizing:border-box}
.form-select:focus{border-color:var(--text)}
.time-pair{display:flex;flex-direction:column;gap:4px}
.time-pair-labels{display:flex;align-items:center}
.time-pair-label{flex:1;font-size:11px;color:var(--text2);font-weight:500;display:flex;align-items:center;gap:3px}
.time-pair-label i{font-size:12px}
.time-pair-gap{width:32px;flex-shrink:0}
.time-pair-inputs{display:flex;align-items:center}
.time-pair-inputs .form-input{flex:1;min-width:0;width:0}
.time-pair-sep{width:32px;flex-shrink:0;text-align:center;font-size:16px;color:var(--text3);line-height:1}
/* memo done */
.memo-section-label{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.05em;padding:10px 0 6px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.memo-section-label.done-label{color:var(--green)}
.memo-done-btn{background:none;border:1.5px solid var(--border2);border-radius:50%;width:22px;height:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;margin-left:auto}
.memo-done-btn.done{background:var(--green);border-color:var(--green)}
.memo-done-btn i{font-size:12px;color:var(--text3)}
.memo-done-btn.done i{color:#fff}
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s}
.color-swatch.selected{border-color:var(--text);transform:scale(1.15)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1;padding:11px;border-radius:var(--r);font-size:14px;cursor:pointer;font-family:inherit}
.btn-cancel{background:none;border:0.5px solid var(--border2);color:var(--text2)}
.btn-save{background:var(--text);border:none;color:#fff;font-weight:500}
.btn-delete{background:none;border:0.5px solid var(--red);color:var(--red)}

/* recur badge on detail */
.recur-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);background:var(--bg2);border-radius:20px;padding:3px 9px;margin-bottom:8px}

/* event detail sheet */
.detail-sheet{background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-width:430px;transform:translateY(20px);transition:transform .2s}
.modal-overlay.open .detail-sheet{transform:translateY(0)}
.detail-color-bar{width:100%;height:5px;border-radius:3px;margin-bottom:14px}
.detail-title{font-size:17px;font-weight:500;margin-bottom:6px}
.detail-time{font-size:13px;color:var(--text2);margin-bottom:8px}
.detail-note{font-size:13px;color:var(--text2);line-height:1.6;white-space:pre-wrap}

/* notification banner */
.notif-banner{display:none;align-items:center;gap:8px;padding:10px 16px;background:#fffbe6;border-bottom:0.5px solid #e0d87a;font-size:12px;color:#7a6a00}
.notif-banner.show{display:flex}
.notif-banner button{margin-left:auto;padding:4px 10px;border:0.5px solid #c8b800;border-radius:8px;background:none;font-size:12px;cursor:pointer;font-family:inherit;color:#7a6a00;white-space:nowrap}

/* ══ DIARY ══ */
.diary-screen{padding:16px;flex:1;overflow-y:auto}
.diary-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.diary-top-title{font-size:16px;font-weight:500}
.diary-top-date{font-size:13px;color:var(--text2)}
.diary-textarea{width:100%;border:0.5px solid var(--border2);border-radius:var(--r);padding:12px 13px;font-size:14px;line-height:1.7;resize:none;font-family:inherit;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
.diary-textarea:focus{border-color:var(--text)}
.save-btn{width:100%;margin-top:10px;padding:12px;border:none;border-radius:var(--r);background:var(--text);color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.save-btn:active{opacity:.75}
.section{margin-top:18px;padding-top:14px;border-top:0.5px solid var(--border)}
.section-title{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase}
.entry-card{background:var(--bg2);border-radius:var(--r);padding:11px 13px;margin-bottom:8px}
.entry-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.entry-date{font-size:11px;color:var(--text2)}
.entry-actions{display:flex;gap:2px;flex-shrink:0}
.entry-act-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px 6px;font-size:15px;border-radius:6px;line-height:1;display:flex;align-items:center;min-width:28px;min-height:28px;justify-content:center}
.entry-act-btn:active{background:var(--bg3)}
.entry-del-btn{color:var(--red)}
.entry-preview{font-size:13px;line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty-msg{text-align:center;color:var(--text3);font-size:13px;padding:28px 0}

/* ══ MEMO ══ */
.memo-screen{padding:16px;flex:1;overflow-y:auto}
.memo-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.memo-header h2{font-size:16px;font-weight:500}
.new-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;border:0.5px solid var(--border2);border-radius:var(--r);background:none;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
.memo-form{background:var(--bg2);border-radius:var(--rl);padding:14px;margin-bottom:14px;display:none}
.memo-form.open{display:block}
.memo-form h3{font-size:14px;font-weight:500;margin-bottom:10px}
.memo-input{width:100%;border:0.5px solid var(--border2);border-radius:var(--r);padding:9px 12px;font-size:16px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;margin-bottom:8px;-webkit-appearance:none;appearance:none}
.memo-input:focus{border-color:var(--text)}
.form-actions-row{display:flex;gap:8px;margin-top:4px}
.form-actions-row button{flex:1;padding:10px;border-radius:var(--r);font-size:13px;cursor:pointer;font-family:inherit}
.btn-c{background:none;border:0.5px solid var(--border2);color:var(--text2)}
.btn-o{background:var(--text);border:none;color:#fff;font-weight:500}
.memo-card{background:var(--bg2);border-radius:var(--r);padding:12px 13px;margin-bottom:8px}
.memo-card-done{opacity:.65}
.memo-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
.memo-card-title{font-size:14px;font-weight:500;flex:1;line-height:1.4}
.memo-card-del{background:none;border:none;color:var(--text3);cursor:pointer;padding:0 0 0 8px;font-size:16px}
.memo-card-body{font-size:13px;color:var(--text2);line-height:1.55;white-space:pre-wrap}
.memo-card-time{font-size:11px;color:var(--text3);margin-top:6px}
/* checklist */
.check-add-row{display:flex;gap:6px}
.check-add-input{flex:1;border:0.5px solid var(--border2);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;resize:none;overflow:hidden;line-height:1.4;min-height:34px;display:block}
.check-add-input:focus{border-color:var(--text)}
.check-add-btn{padding:7px 12px;border:0.5px solid var(--border2);border-radius:8px;background:none;color:var(--text);font-size:18px;cursor:pointer;line-height:1;display:flex;align-items:center}
.check-add-btn:active{background:var(--bg2)}
.check-group{margin-top:8px}
.check-group-label{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.05em;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.check-group-label span{background:var(--bg3);border-radius:10px;padding:1px 6px;font-size:10px}
.check-group-label.done-label{color:var(--green)}
.check-group-label.done-label span{background:#e6f5ef;color:var(--green)}
.memo-checklist{display:flex;flex-direction:column;gap:2px}
.memo-check-item{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;user-select:none}
.memo-check-item .ci-box{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.memo-check-item.done .ci-box{background:var(--text);border-color:var(--text)}
.memo-check-item.done .ci-box::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
.memo-check-item .ci-label{font-size:13px;color:var(--text2);line-height:1.4;transition:all .15s;word-break:break-all;flex:1}
.memo-check-item.done .ci-label{text-decoration:line-through;color:var(--text3)}

/* ══ HEADER ICONS ══ */
.header-icon-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:20px;padding:5px;display:flex;align-items:center;border-radius:8px;min-width:32px;min-height:32px;justify-content:center}
.header-icon-btn:active{background:var(--bg2)}

/* ══ TODAY BTN ══ */
.today-btn{padding:4px 10px;border:0.5px solid var(--border2);border-radius:8px;background:none;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.today-btn:active{background:var(--bg2)}

/* ══ DIARY MARKER ══ */
.diary-dot{width:5px;height:5px;border-radius:50%;background:var(--green);margin:1px auto 0}

/* ══ MEMO EDIT BTN ══ */
.memo-card-edit{background:none;border:none;color:var(--text3);cursor:pointer;padding:0 4px 0 0;font-size:16px;display:flex;align-items:center;min-width:24px;min-height:24px;justify-content:center}

/* ══ SEARCH (ボトムシート) ══ */
.search-input-wrap{display:flex;align-items:center;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r);padding:0 10px;gap:6px;flex:1}
.search-input-wrap i{color:var(--text3);font-size:16px;flex-shrink:0}
.search-input{flex:1;border:none;background:none;padding:8px 0;font-size:16px;font-family:inherit;color:var(--text);outline:none}
.search-section-title{font-size:11px;font-weight:500;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin:14px 0 6px}
.search-item{padding:10px 12px;background:var(--bg2);border-radius:var(--r);margin-bottom:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.search-item:active{opacity:.7}
.search-item-title{font-size:13px;font-weight:500;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.search-item-sub{font-size:11px;color:var(--text2);line-height:1.4}
.search-empty{text-align:center;color:var(--text3);font-size:13px;padding:32px 0}

/* ══ TOGGLE SWITCH ══ */
.toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle-switch{width:46px;height:26px;border-radius:13px;background:var(--border2);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.toggle-switch.on{background:var(--text)}
.toggle-thumb{width:22px;height:22px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25);pointer-events:none}
.toggle-switch.on .toggle-thumb{transform:translateX(20px)}

/* ══ DATE PAIR ══ */
.date-pair{display:flex;align-items:center;gap:6px}
.date-pair .form-input{flex:1;min-width:0}
.date-pair-sep{color:var(--text3);font-size:13px;flex-shrink:0}

/* ══ SETTINGS MODAL ══ */
.settings-section{margin-bottom:18px}
.settings-section-title{font-size:11px;font-weight:500;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}
.settings-btn{width:100%;padding:12px 14px;border:0.5px solid var(--border2);border-radius:var(--r);background:none;color:var(--text);font-size:14px;cursor:pointer;font-family:inherit;text-align:left;display:flex;align-items:center;gap:10px;margin-bottom:8px;-webkit-tap-highlight-color:transparent}
.settings-btn:active{background:var(--bg2)}
.settings-btn i{font-size:18px;color:var(--text2);flex-shrink:0}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <h1 id="header-title">カレンダー</h1>
    <div style="display:flex;align-items:center;gap:2px">
      <button class="header-icon-btn" onclick="openSearch()" title="検索"><i class="ti ti-search"></i></button>
      <button class="header-icon-btn" onclick="openSettings()" title="設定"><i class="ti ti-settings"></i></button>
      <div style="text-align:right;margin-left:4px">
        <span class="header-date" id="header-date"></span>
        <span class="header-ver" id="header-ver"></span>
      </div>
    </div>
  </div>

  <!-- Notification permission banner -->
  <div class="notif-banner" id="notif-banner">
    <i class="ti ti-bell"></i>
    <span>リマインダー通知を有効にしますか？</span>
    <button onclick="requestNotifPermission()">許可する</button>
    <button onclick="dismissNotifBanner()" style="border:none;color:var(--text3);background:none;font-size:18px;padding:0 0 0 4px">×</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('calendar')"><i class="ti ti-calendar" aria-hidden="true"></i>カレンダー</div>
    <div class="tab" onclick="switchTab('diary')"><i class="ti ti-book" aria-hidden="true"></i>日記</div>
    <div class="tab" onclick="switchTab('memo')"><i class="ti ti-notes" aria-hidden="true"></i>メモ帳</div>
    <div class="tab" onclick="switchTab('tasks')"><i class="ti ti-checkbox" aria-hidden="true"></i>タスク</div>
  </div>

  <!-- ══ CALENDAR SCREEN ══ -->
  <div id="screen-calendar" class="screen active">
    <div class="cal-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px 0">
        <div class="view-switcher">
          <button class="view-btn active" id="vbtn-month" onclick="setView('month')">月</button>
          <button class="view-btn" id="vbtn-week" onclick="setView('week')">週</button>
          <button class="view-btn" id="vbtn-day" onclick="setView('day')">日</button>
        </div>
        <div class="cal-actions">
          <button class="add-event-btn today-open-btn" onclick="openTodayModal()" aria-label="本日の予定" title="本日の予定"><i class="ti ti-calendar-event" aria-hidden="true"></i><span class="btn-lbl">本日の予定</span></button>
          <button class="add-event-btn" onclick="openAddModal()"><i class="ti ti-plus" aria-hidden="true"></i>予定を追加</button>
        </div>
      </div>
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="navBack()"><i class="ti ti-chevron-left"></i></button>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="cal-nav-label" id="cal-nav-label" onclick="openDateJumper()" style="cursor:pointer" title="日付を選択"><i class="ti ti-chevron-down"></i></span>
          <button class="today-btn" onclick="jumpToToday()">今日</button>
        </div>
        <button class="cal-nav-btn" onclick="navFwd()"><i class="ti ti-chevron-right"></i></button>
      </div>

      <!-- Monthly view -->
      <div id="view-month" style="display:flex;flex-direction:column;flex:1;overflow-y:auto">
        <div class="cal-head" style="padding:0 4px">
          <div class="cal-dow">日</div><div class="cal-dow">月</div><div class="cal-dow">火</div>
          <div class="cal-dow">水</div><div class="cal-dow">木</div><div class="cal-dow">金</div><div class="cal-dow">土</div>
        </div>
        <div class="cal-body-month" id="cal-body-month" style="margin:0 4px"></div>
      </div>

      <!-- Weekly view -->
      <div id="view-week">
        <div class="week-head" id="week-head"><div></div></div>
        <div class="time-grid" id="time-grid-week"></div>
      </div>

      <!-- Daily view -->
      <div id="view-day">
        <div class="day-head"><div class="day-head-label" id="day-head-label"></div></div>
        <div class="day-time-grid" id="time-grid-day"></div>
      </div>
    </div>
  </div>

  <!-- ══ DIARY SCREEN ══ -->
  <div id="screen-diary" class="screen">
    <div class="diary-screen">
      <div class="diary-top">
        <span class="diary-top-title">今日の日記</span>
        <span class="diary-top-date" id="diary-date-label"></span>
      </div>
      <textarea class="diary-textarea" id="diary-text" rows="10" placeholder="今日はどんな一日でしたか？"></textarea>
      <button class="save-btn" id="diary-btn" onclick="saveDiary()">保存する</button>
      <div class="section">
        <div class="section-title">最近の日記</div>
        <div id="diary-list"></div>
      </div>
    </div>
  </div>

  <!-- ══ MEMO SCREEN ══ -->
  <div id="screen-memo" class="screen">
    <div class="memo-screen">
      <div class="memo-header">
        <h2>メモ帳</h2>
        <button class="new-btn" onclick="toggleMemoForm()"><i class="ti ti-plus" aria-hidden="true"></i>新規</button>
      </div>
      <div class="memo-form" id="memo-form">
        <h3>新しいメモ</h3>
        <input class="memo-input" type="text" id="memo-title-in" placeholder="タイトル">
        <textarea class="memo-input diary-textarea" id="memo-body-in" rows="3" placeholder="メモの内容を入力…" style="margin-bottom:0"></textarea>
        <div class="form-actions-row" style="margin-top:10px">
          <button class="btn-c" onclick="toggleMemoForm()">キャンセル</button>
          <button class="btn-o" onclick="saveMemo()">保存</button>
        </div>
      </div>
      <div id="memo-list"></div>
    </div>
  </div>

  <!-- ══ TASKS SCREEN ══ -->
  <div id="screen-tasks" class="screen"></div>

</div><!-- .app -->

<!-- ══ DATE JUMP MODAL ══ -->
<div class="date-jump-overlay" id="date-jump-overlay" onclick="closeDateJumper()">
  <div class="date-jump-pop" onclick="event.stopPropagation()">
    <div class="date-jump-inner">
      <h3>日付を選択</h3>
      <input class="form-input" type="date" id="date-jump-input" style="margin-bottom:12px">
      <div style="display:flex;gap:8px">
        <button class="btn-cancel" style="flex:1;padding:11px;border-radius:var(--r);font-size:14px;cursor:pointer;font-family:inherit;background:none;border:0.5px solid var(--border2);color:var(--text2)" onclick="closeDateJumper()">キャンセル</button>
        <button class="btn-save"   style="flex:1;padding:11px;border-radius:var(--r);font-size:14px;cursor:pointer;font-family:inherit;background:var(--text);border:none;color:#fff;font-weight:500" onclick="confirmDateJump()">移動</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ ADD/EDIT EVENT MODAL ══ -->
<div class="modal-overlay" id="event-modal">
  <div class="modal-sheet">
    <div class="modal-sheet-inner">
      <div class="modal-title" id="modal-title-text">予定を追加</div>
      <div class="form-row">
        <label class="form-label">タイトル</label>
        <input class="form-input" type="text" id="evt-title" placeholder="予定のタイトル">
      </div>
      <div class="form-row">
        <label class="form-label">日付</label>
        <div class="date-pair">
          <input class="form-input" type="date" id="evt-date">
          <span class="date-pair-sep">〜</span>
          <input class="form-input" type="date" id="evt-date-end" placeholder="終了日（任意）">
        </div>
      </div>
      <div class="form-row">
        <div class="toggle-row">
          <label class="form-label" style="margin-bottom:0">終日</label>
          <div class="toggle-switch" id="allday-toggle" onclick="toggleAllDay()"><div class="toggle-thumb"></div></div>
        </div>
      </div>
      <div class="form-row" id="time-row">
        <label class="form-label">時間</label>
        <div class="time-pair">
          <div class="time-pair-labels">
            <div class="time-pair-label"><i class="ti ti-clock"></i>開始時刻</div>
            <div class="time-pair-gap"></div>
            <div class="time-pair-label"><i class="ti ti-clock-off"></i>終了時刻</div>
          </div>
          <div class="time-pair-inputs">
            <input class="form-input" type="time" id="evt-start">
            <div class="time-pair-sep">〜</div>
            <input class="form-input" type="time" id="evt-end">
          </div>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">繰り返し</label>
        <select class="form-select" id="evt-recur" onchange="onRecurChange()">
          <option value="none">なし</option>
          <option value="daily">毎日</option>
          <option value="weekly">毎週</option>
          <option value="monthly">毎月</option>
          <option value="yearly">毎年</option>
        </select>
      </div>
      <div class="form-row" id="recur-end-row" style="display:none">
        <label class="form-label">繰り返し終了日（任意）</label>
        <input class="form-input" type="date" id="evt-recur-end">
      </div>
      <div class="form-row">
        <label class="form-label">リマインダー</label>
        <select class="form-select" id="evt-reminder">
          <option value="none">なし</option>
          <option value="0">時刻通り</option>
          <option value="5">5分前</option>
          <option value="10">10分前</option>
          <option value="30">30分前</option>
          <option value="60">1時間前</option>
          <option value="1440">1日前</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">メモ（任意）</label>
        <textarea class="form-input diary-textarea" id="evt-note" rows="1" placeholder="詳細メモ" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" style="overflow:hidden;min-height:38px;line-height:1.5;resize:none"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">カラー</label>
        <div class="color-row" id="color-swatches"></div>
      </div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>
</div>

<!-- ══ TODAY EVENTS MODAL (本日の予定) ══ -->
<div class="modal-overlay" id="today-modal">
  <div class="modal-sheet">
    <div class="modal-sheet-inner">
      <div class="modal-title" id="today-modal-title">本日の予定</div>
      <div id="today-modal-list"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeTodayModal()">閉じる</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ EVENT DETAIL MODAL ══ -->
<div class="modal-overlay" id="detail-modal">
  <div class="detail-sheet">
    <div class="detail-color-bar" id="detail-color-bar"></div>
    <div class="detail-title" id="detail-title"></div>
    <div class="detail-time" id="detail-time"></div>
    <div id="detail-recur-wrap"></div>
    <div id="detail-reminder-wrap"></div>
    <div class="detail-note" id="detail-note"></div>
    <div class="modal-actions" style="margin-top:20px">
      <button class="btn-cancel" onclick="closeDetail()">閉じる</button>
      <button class="btn-delete" onclick="deleteEventFromDetail()">削除</button>
      <button class="btn-save" onclick="editEventFromDetail()">編集</button>
    </div>
  </div>
</div>

<!-- ══ SEARCH MODAL (ボトムシート) ══ -->
<div class="modal-overlay" id="search-modal">
  <div class="modal-sheet">
    <div class="modal-sheet-inner">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <div class="search-input-wrap">
          <i class="ti ti-search"></i>
          <input class="search-input" type="text" id="search-input" placeholder="予定・日記・メモを検索…" oninput="onSearchInput()" autocomplete="off">
        </div>
        <button class="header-icon-btn" onclick="closeSearch()" style="flex-shrink:0"><i class="ti ti-x"></i></button>
      </div>
      <div id="search-results"><div class="search-empty">キーワードを入力してください</div></div>
    </div>
  </div>
</div>

<!-- ══ SETTINGS MODAL ══ -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal-sheet">
    <div class="modal-sheet-inner">
      <div class="modal-title">設定</div>
      <div class="settings-section">
        <div class="settings-section-title">データ管理</div>
        <button class="settings-btn" onclick="exportData()"><i class="ti ti-download"></i>データをエクスポート（JSON）</button>
        <button class="settings-btn" onclick="document.getElementById('import-file').click()"><i class="ti ti-upload"></i>データをインポート（JSON）</button>

<!-- ══ MEMO EDIT MODAL ══ -->
<div class="modal-overlay" id="memo-edit-modal">
  <div class="modal-sheet">
    <div class="modal-sheet-inner">
      <div class="modal-title">メモを編集</div>
      <input class="memo-input" type="text" id="memo-edit-title" placeholder="タイトル" style="margin-bottom:8px;display:block;width:100%;box-sizing:border-box">
      <textarea class="memo-input diary-textarea" id="memo-edit-body" rows="5" placeholder="メモの内容" style="margin-bottom:0;display:block;width:100%;box-sizing:border-box"></textarea>
      <div class="modal-actions" style="margin-top:12px">
        <button class="btn-cancel" onclick="closeMemoEdit()">キャンセル</button>
        <button class="btn-save" onclick="saveMemoEdit()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ DIARY EDIT MODAL ══ -->
<div class="modal-overlay" id="diary-edit-modal">
  <div class="modal-sheet">
    <div class="modal-sheet-inner">
      <div class="modal-title" id="diary-edit-date"></div>
      <textarea class="diary-textarea" id="diary-edit-text" rows="12" placeholder="日記の内容" style="min-height:180px;width:100%"></textarea>
      <div class="modal-actions" style="margin-top:12px">
        <button class="btn-cancel" onclick="closeDiaryEdit()">キャンセル</button>
        <button class="btn-save" onclick="saveDiaryEdit()">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════
   DATA
══════════════════════════ */
const VERSION = 'ver.1.8.0';
const TODAY = new Date();
TODAY.setHours(0,0,0,0);

const EVENT_COLORS = [
  {name:'ピンク',   hex:'#ffb3c6'},
  {name:'オレンジ', hex:'#ffd4a8'},
  {name:'黄',      hex:'#fff0a3'},
  {name:'ミント',   hex:'#a8e6cf'},
  {name:'スカイ',   hex:'#a8d8f0'},
  {name:'ラベンダー',hex:'#c5b8f5'},
  {name:'ライラック',hex:'#e8b8e8'},
  {name:'グレー',   hex:'#d4d2ce'},
];

const RECUR_LABELS = {none:'なし',daily:'毎日',weekly:'毎週',monthly:'毎月',yearly:'毎年'};
const REMINDER_LABELS = {none:'なし','0':'時刻通り','5':'5分前','10':'10分前','30':'30分前','60':'1時間前','1440':'1日前'};

let events = [];
let diaries = {};
let memos = [];
try { events  = JSON.parse(localStorage.getItem('md_events')  || '[]'); } catch(e){}
try { diaries = JSON.parse(localStorage.getItem('md_diaries') || '{}'); } catch(e){}
try { memos   = JSON.parse(localStorage.getItem('md_memos')   || '[]'); } catch(e){}

function persist() {
  try {
    localStorage.setItem('md_events',  JSON.stringify(events));
    localStorage.setItem('md_diaries', JSON.stringify(diaries));
    localStorage.setItem('md_memos',   JSON.stringify(memos));
  } catch(e) {}
}

/* ══════════════════════════
   HELPERS
══════════════════════════ */
function fmt(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseDateStr(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function dayLabel(dateStr) {
  const d = parseDateStr(dateStr);
  const DOW = ['日','月','火','水','木','金','土'];
  const p = dateStr.split('-');
  return p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日('+DOW[d.getDay()]+')';
}
function setNavLabel(text) {
  document.getElementById('cal-nav-label').innerHTML =
    text + ' <i class="ti ti-chevron-down"></i>';
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function weekStart(d) {
  const day = d.getDay();
  const diff = (day === 0) ? -6 : 1 - day;
  const r = new Date(d);
  r.setDate(d.getDate() + diff);
  r.setHours(0,0,0,0);
  return r;
}

/* ══════════════════════════
   RECURRENCE
══════════════════════════ */
function matchesRecurrence(evt, dateStr) {
  if (!evt.recur || evt.recur === 'none') return false;
  const base   = parseDateStr(evt.date);
  const target = parseDateStr(dateStr);
  // only future occurrences; base date itself is handled as direct match
  if (target <= base) return false;
  if (evt.recurEnd && target > parseDateStr(evt.recurEnd)) return false;
  switch (evt.recur) {
    case 'daily':   return true;
    case 'weekly':  return base.getDay() === target.getDay();
    case 'monthly': return base.getDate() === target.getDate();
    case 'yearly':  return base.getMonth() === target.getMonth() && base.getDate() === target.getDate();
    default: return false;
  }
}

function eventsOn(dateStr) {
  return events.filter(e => {
    if (e.date === dateStr) return true;
    if (e.dateEnd && dateStr > e.date && dateStr <= e.dateEnd) return true;
    return matchesRecurrence(e, dateStr);
  })
    .sort((a,b) => {
      if (!a.start && !b.start) return 0;
      if (!a.start) return -1;
      if (!b.start) return 1;
      return a.start.localeCompare(b.start);
    });
}

/* ══════════════════════════
   NOTIFICATIONS
══════════════════════════ */
function initNotifications() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    document.getElementById('notif-banner').classList.add('show');
  } else if (Notification.permission === 'granted') {
    scheduleReminders();
  }
}

function requestNotifPermission() {
  Notification.requestPermission().then(p => {
    dismissNotifBanner();
    if (p === 'granted') scheduleReminders();
  });
}

function dismissNotifBanner() {
  document.getElementById('notif-banner').classList.remove('show');
}

function scheduleReminders() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();

  events.forEach(evt => {
    if (!evt.reminder || evt.reminder === 'none') return;
    if (!evt.start) return;
    const reminderMin = parseInt(evt.reminder);

    // Check today and tomorrow for occurrences
    for (let i = 0; i < 2; i++) {
      const d = addDays(TODAY, i);
      const dStr = fmt(d);
      if (evt.date !== dStr && !matchesRecurrence(evt, dStr)) continue;

      const [h, m] = evt.start.split(':').map(Number);
      const eventTime = new Date(d);
      eventTime.setHours(h, m, 0, 0);
      const notifyTime = new Date(eventTime.getTime() - reminderMin * 60000);
      const delay = notifyTime.getTime() - now.getTime();

      if (delay > 0 && delay < 48 * 60 * 60 * 1000) {
        const key = 'notif_' + evt.id + '_' + dStr;
        if (!sessionStorage.getItem(key)) {
          setTimeout(() => {
            const timeLabel = reminderMin > 0 ? reminderMin + '分後に開始' : '開始時刻です';
            new Notification('📅 ' + evt.title, {
              body: dayLabel(dStr) + ' ' + evt.start + '\n' + timeLabel,
            });
            sessionStorage.setItem(key, '1');
          }, delay);
        }
      }
    }
  });
}

/* ══════════════════════════
   STATE
══════════════════════════ */
let currentView = 'month';
let calCursor = new Date(TODAY);
let calCellH = 90;        // 月表示のセルの高さ(画面の高さに合わせて決める)
let taskDue = {};         // 日付ごとの未完了タスク(Tasks.pendingByDate())。描画のたびに更新
let monthPillMax = 3;     // 月表示のセルに出す予定の件数(セルが低いときは2件)

/* ══════════════════════════
   TAB SWITCHING
══════════════════════════ */
function switchTab(t) {
  ['calendar','diary','memo','tasks'].forEach((s,i) => {
    document.getElementById('screen-'+s).classList.toggle('active', s===t);
    document.querySelectorAll('.tab')[i].classList.toggle('active', s===t);
  });
  document.getElementById('header-title').textContent = {calendar:'カレンダー',diary:'日記',memo:'メモ帳',tasks:'タスク'}[t];
  if (t==='diary') renderDiary();
  if (t==='memo')  renderMemos();
  if (t==='tasks') Tasks.render();
  if (t==='calendar') renderCurrentView();
}

/* ══════════════════════════
   VIEW SWITCHING
══════════════════════════ */
function setView(v) {
  if (currentView === v) calCursor = new Date(TODAY);
  currentView = v;
  ['month','week','day'].forEach(x => {
    document.getElementById('vbtn-'+x).classList.toggle('active', x===v);
    const el = document.getElementById('view-'+x);
    if (x === 'month') { el.style.display = v==='month' ? '' : 'none'; }
    else { el.classList.toggle('show', x===v); }
  });
  renderCurrentView();
}

function navBack() {
  if (currentView==='month') calCursor.setMonth(calCursor.getMonth()-1);
  else if (currentView==='week') calCursor.setDate(calCursor.getDate()-7);
  else calCursor.setDate(calCursor.getDate()-1);
  renderCurrentView();
}
function navFwd() {
  if (currentView==='month') calCursor.setMonth(calCursor.getMonth()+1);
  else if (currentView==='week') calCursor.setDate(calCursor.getDate()+7);
  else calCursor.setDate(calCursor.getDate()+1);
  renderCurrentView();
}
function renderCurrentView() {
  if (currentView==='month') renderMonth();
  else if (currentView==='week') renderWeek();
  else renderDay();
}
function jumpToToday() {
  calCursor = new Date(TODAY);
  renderCurrentView();
  if (currentView === 'week' || currentView === 'day') {
    const nowH = new Date().getHours();
    const CELL_H = currentView === 'week' ? 44 : 56;
    const gridId = currentView === 'week' ? 'time-grid-week' : 'time-grid-day';
    setTimeout(() => {
      const grid = document.getElementById(gridId);
      if (grid) grid.scrollTop = Math.max(0, nowH * CELL_H - 80);
    }, 80);
  }
}

function openDateJumper() {
  const input = document.getElementById('date-jump-input');
  input.type = 'date';
  input.value = fmt(calCursor);
  document.getElementById('date-jump-overlay').classList.add('open');
  setTimeout(() => input.focus(), 100);
}

function closeDateJumper() {
  document.getElementById('date-jump-overlay').classList.remove('open');
}

function confirmDateJump() {
  const val = document.getElementById('date-jump-input').value;
  if (!val) return;
  calCursor = parseDateStr(val);
  closeDateJumper();
  renderCurrentView();
}

/* ══════════════════════════
   MONTHLY VIEW
══════════════════════════ */
/* 6週の月でもスクロールなしで収まるよう、画面の高さに合わせてセルの高さを決める(52〜100px) */
function fitMonthCells(rows) {
  const body = document.getElementById('cal-body-month');
  if (body.offsetParent !== null) {                     // 表示中のときだけ測れる
    const top = body.getBoundingClientRect().top + window.scrollY;
    const pb = parseFloat(getComputedStyle(document.querySelector('.app')).paddingBottom) || 0;
    const avail = window.innerHeight - top - 4 - pb;
    calCellH = Math.max(52, Math.min(100, Math.floor(avail / rows)));
  }
  monthPillMax = calCellH >= 86 ? 3 : calCellH >= 64 ? 2 : 1;
  body.style.setProperty('--cal-cell-h', calCellH + 'px');
}

function renderMonth() {
  taskDue = Tasks.pendingByDate();
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  setNavLabel(y+'年'+(m+1)+'月');
  const fd = new Date(y, m, 1).getDay();
  const ld = new Date(y, m+1, 0).getDate();
  const pl = new Date(y, m, 0).getDate();
  fitMonthCells(Math.ceil((fd+ld)/7));
  let h = '';
  for (let i = 0; i < fd; i++) {
    const d = pl - fd + 1 + i;
    const pm = m === 0 ? 12 : m;
    const py = m === 0 ? y-1 : y;
    const k = py+'-'+String(pm).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    h += monthCell(d, k, true);
  }
  for (let d = 1; d <= ld; d++) {
    const k = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dw = (fd+d-1)%7;
    const isT = fmt(TODAY)===k;
    const cls = [isT?'today':'', dw===0?'sun':dw===6?'sat':''].filter(Boolean).join(' ');
    h += monthCell(d, k, false, cls);
  }
  const rem = (7-((fd+ld)%7))%7;
  for (let i = 1; i <= rem; i++) {
    const nm = m === 11 ? 1 : m+2;
    const ny = m === 11 ? y+1 : y;
    const k = ny+'-'+String(nm).padStart(2,'0')+'-'+String(i).padStart(2,'0');
    h += monthCell(i, k, true);
  }
  document.getElementById('cal-body-month').innerHTML = h;
}

function renderTodayList() {
  const todayStr = fmt(TODAY);
  const todayEvts = eventsOn(todayStr);
  const list = document.getElementById('today-modal-list');
  document.getElementById('today-modal-title').textContent = '本日の予定' + (todayEvts.length ? ' (' + todayEvts.length + '件)' : '');
  if (!todayEvts.length) {
    list.innerHTML = `<div class="today-empty">本日の予定はありません</div>`;
    return;
  }
  list.innerHTML = todayEvts.map(e => {
    const timeStr = e.start ? e.start + (e.end ? ' 〜 ' + e.end : '') : '終日';
    return `<div class="today-evt-item" onclick="openTodayEvent('${e.id}')">
      <div class="today-evt-dot" style="background:${e.color}"></div>
      <div class="today-evt-info">
        <div class="today-evt-title">${escHtml(e.title)}</div>
        <div class="today-evt-time">${timeStr}</div>
      </div>
    </div>`;
  }).join('');
}

/* 本日の予定のポップアップ(予定追加と同じボトムシート形式)。開き方: 「本日の予定」ボタン / 今日のマスの長押し */
function openTodayModal() {
  renderTodayList();
  lockScroll();
  document.getElementById('today-modal').classList.add('open');
}
function closeTodayModal() {
  document.getElementById('today-modal').classList.remove('open');
  unlockScroll();
}
function openTodayEvent(id) {
  closeTodayModal();
  showDetail(id, fmt(TODAY));
}

function monthCell(d, k, other, extra='') {
  const evts = eventsOn(k);
  const pills = evts.slice(0,monthPillMax).map(e => {
    return `<div class="evt-pill" style="background:${e.color}">${escHtml(e.title)}</div>`;
  }).join('');
  const moreDot = evts.length > monthPillMax ? `<div style="font-size:9px;color:var(--text3);text-align:center">…</div>` : '';
  const diaryMark = diaries[k] ? `<div class="diary-dot"></div>` : '';
  const tk = taskDue[k] || [];
  const taskBadge = tk.length
    ? `<span class="task-badge${tk.some(t => t.overdue) ? ' over' : ''}" aria-label="タスク${tk.length}件">${tk.length > 99 ? '99+' : tk.length}</span>` : '';
  const cls = ['cal-cell', other?'other':'', extra].filter(Boolean).join(' ');
  return `<div class="${cls}" onclick="onMonthDayClick('${k}')">
    <div class="dnum">${d}</div>${taskBadge}${pills}${moreDot}${diaryMark}
  </div>`;
}

let calSuppressClick = false;   // 長押しでポップアップを開いた直後のクリックを無視する
function onMonthDayClick(k) {
  if (calSuppressClick) return;
  calCursor = parseDateStr(k);
  setView('day');
}

/* ══════════════════════════
   WEEKLY VIEW
══════════════════════════ */
function renderWeek() {
  taskDue = Tasks.pendingByDate();
  const ws = weekStart(calCursor);
  const we = addDays(ws, 6);
  const ys = ws.getFullYear(), ms = ws.getMonth()+1, ds = ws.getDate();
  const ye = we.getFullYear(), me = we.getMonth()+1, de = we.getDate();
  setNavLabel((ys===ye ? '' : ys+'年') + ms+'月'+ds+'日 〜 '+(ms===me?'':me+'月')+de+'日');

  let headH = '<div style="font-size:10px;color:var(--text3);text-align:right;padding-right:4px;padding-top:3px">時</div>';
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    const dStr = fmt(d);
    const isT = dStr === fmt(TODAY);
    const dw = d.getDay();
    const dowLabel = ['日','月','火','水','木','金','土'][dw];
    const sunCls = dw===0?'sun':''; const satCls = dw===6?'sat':'';
    const todCls = isT?'today':'';
    headH += `<div class="week-day-col ${sunCls} ${satCls} ${todCls}">
      <div class="wdow">${dowLabel}</div>
      <div class="wdnum">${d.getDate()}</div>
    </div>`;
  }
  document.getElementById('week-head').innerHTML = headH;

  const CELL_H = 44;
  let gridH = '';
  for (let hr = 0; hr < 24; hr++) {
    gridH += `<div class="week-time-row">
      <div class="time-label">${String(hr).padStart(2,'0')}:00</div>`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i);
      const dStr = fmt(d);
      gridH += `<div class="time-cell" onclick="openAddModal('${dStr}','${String(hr).padStart(2,'0')}:00')"></div>`;
    }
    gridH += '</div>';
  }
  document.getElementById('time-grid-week').innerHTML = gridH;

  const grid = document.getElementById('time-grid-week');
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    const dStr = fmt(d);
    eventsOn(dStr).forEach(evt => {
      if (!evt.start) return;
      const [sh, sm] = evt.start.split(':').map(Number);
      const [eh, em] = (evt.end||evt.start).split(':').map(Number);
      const topPx = (sh + sm/60) * CELL_H;
      const duration = Math.max(0.5, (eh + em/60) - (sh + sm/60));
      const heightPx = duration * CELL_H;
      const rowEls = grid.querySelectorAll('.week-time-row');
      const rowEl = rowEls[sh];
      if (!rowEl) return;
      const cellEl = rowEl.querySelectorAll('.time-cell')[i];
      if (!cellEl) return;
      const pill = document.createElement('div');
      pill.className = 'time-evt';
      pill.style.cssText = `background:${evt.color};top:${sm/60*CELL_H}px;height:${heightPx}px;`;
      pill.innerHTML = `<span>${evt.start} ${escHtml(evt.title)}</span>`;
      pill.onclick = (e) => { e.stopPropagation(); showDetail(evt.id, dStr); };
      cellEl.style.position = 'relative';
      cellEl.appendChild(pill);
    });
  }

  // タスクの期限の線(同じ時刻は1本)
  for (let i = 0; i < 7; i++) {
    const dStr = fmt(addDays(ws, i));
    const times = [...new Set((taskDue[dStr] || []).map(t => t.time))];
    times.forEach(tm => {
      const [th, tmin] = tm.split(':').map(Number);
      const rowEl = grid.querySelectorAll('.week-time-row')[th];
      const cellEl = rowEl && rowEl.querySelectorAll('.time-cell')[i];
      if (!cellEl) return;
      cellEl.style.position = 'relative';
      const line = document.createElement('div');
      line.className = 'task-line';
      line.style.top = (tmin/60*CELL_H) + 'px';
      cellEl.appendChild(line);
    });
  }

  // Now line
  const todayStr = fmt(TODAY);
  const ws2 = weekStart(calCursor);
  const isThisWeek = todayStr >= fmt(ws2) && todayStr <= fmt(addDays(ws2, 6));
  if (isThisWeek) {
    const now = new Date();
    const nowH = now.getHours(), nowM = now.getMinutes();
    const todayDow = TODAY.getDay();
    const colIdx = todayDow === 0 ? 6 : todayDow - 1;
    const rowEls = grid.querySelectorAll('.week-time-row');
    const rowEl = rowEls[nowH];
    if (rowEl) {
      const cellEl = rowEl.querySelectorAll('.time-cell')[colIdx];
      if (cellEl) {
        cellEl.style.position = 'relative';
        const line = document.createElement('div');
        line.className = 'now-line';
        const timeLabel = String(nowH).padStart(2,'0')+':'+String(nowM).padStart(2,'0');
        line.style.top = (nowM/60*CELL_H) + 'px';
        line.innerHTML = `<div class="now-line-dot"></div><div class="now-line-bar"></div><div class="now-line-time">${timeLabel}</div>`;
        cellEl.appendChild(line);
      }
    }
    setTimeout(() => { grid.scrollTop = Math.max(0, nowH * CELL_H - 80); }, 50);
  }
}

/* ══════════════════════════
   DAILY VIEW
══════════════════════════ */
function renderDay() {
  const dStr = fmt(calCursor);
  taskDue = Tasks.pendingByDate();
  setNavLabel(dayLabel(dStr));
  document.getElementById('day-head-label').textContent = dayLabel(dStr);

  const CELL_H = 56;  // height for busy hours (event sizing base)
  const EMPTY_H = 20; // height for empty hours

  const dayEvts = eventsOn(dStr);

  // determine which hours are "busy" (have events overlapping them)
  const busyHours = new Set();
  if (dStr === fmt(TODAY)) {
    busyHours.add(new Date().getHours()); // keep now-line hour full height
  }
  dayEvts.forEach(evt => {
    if (!evt.start) { busyHours.add(0); return; }
    const [sh, sm] = evt.start.split(':').map(Number);
    const [eh, em] = (evt.end || evt.start).split(':').map(Number);
    const endH = em > 0 ? eh : Math.max(sh, eh - 1);
    for (let h = sh; h <= Math.min(endH, 23); h++) busyHours.add(h);
  });

  const dayTasks = taskDue[dStr] || [];
  dayTasks.forEach(t => busyHours.add(Number(t.time.slice(0, 2))));   // 線と名前の置き場所を確保
  let html = '';
  for (let hr = 0; hr < 24; hr++) {
    const busy = busyHours.has(hr);
    const rowH = busy ? CELL_H : EMPTY_H;
    const lblStyle = busy ? '' : 'font-size:9px;color:var(--text3);opacity:0.7;';
    html += `<div class="day-row" style="min-height:${rowH}px;border-bottom:0.5px solid var(--border)">
      <div class="day-time-lbl" style="${lblStyle}">${String(hr).padStart(2,'0')}:00</div>
      <div class="day-slot" id="dslot-${hr}" style="min-height:${rowH}px" onclick="openAddModal('${dStr}','${String(hr).padStart(2,'0')}:00')"></div>
    </div>`;
  }
  document.getElementById('time-grid-day').innerHTML = html;

  const colMap = computeColumns(dayEvts);

  dayEvts.forEach(evt => {
    if (!evt.start) {
      const slot = document.getElementById('dslot-0');
      if (!slot) return;
      const pill = document.createElement('div');
      pill.className = 'day-evt';
      pill.style.cssText = `background:${evt.color};position:relative;left:4px;right:4px;margin:4px;`;
      pill.innerHTML = evt.title;
      pill.onclick = (e) => { e.stopPropagation(); showDetail(evt.id, dStr); };
      slot.parentNode.insertBefore(pill, slot.parentNode.firstChild);
      return;
    }
    const [sh, sm] = evt.start.split(':').map(Number);
    const [eh, em] = (evt.end || evt.start).split(':').map(Number);
    const duration = Math.max(0.5, (eh + em/60) - (sh + sm/60));
    const slot = document.getElementById('dslot-'+sh);
    if (!slot) return;
    const pill = document.createElement('div');
    pill.className = 'day-evt';
    const heightPx = duration * CELL_H - 4;
    const info = colMap.get(evt.id) || { col: 0, overlap: false };
    let leftCss, rightCss;
    if (!info.overlap) { leftCss = '4px'; rightCss = '4px'; }
    else if (info.col === 0) { leftCss = '4px'; rightCss = 'calc(50% + 2px)'; }
    else { leftCss = 'calc(50% + 2px)'; rightCss = '4px'; }
    pill.style.cssText = `background:${evt.color};top:${sm/60*CELL_H+2}px;height:${heightPx}px;left:${leftCss};right:${rightCss};overflow:visible;`;
    pill.innerHTML = `<strong>${evt.start}${evt.end?' 〜 '+evt.end:''}</strong><br>${evt.title}`;
    pill.onclick = (e) => { e.stopPropagation(); showDetail(evt.id, dStr); };
    slot.style.position = 'relative';
    slot.style.overflow = 'visible';
    slot.appendChild(pill);
  });

  // タスクの期限の線(同じ時刻のタスクは1本にまとめ、名前を並べる)
  const taskByTime = {};
  dayTasks.forEach(t => { (taskByTime[t.time] = taskByTime[t.time] || []).push(t.title); });
  Object.keys(taskByTime).forEach(tm => {
    const [th, tmin] = tm.split(':').map(Number);
    const slot = document.getElementById('dslot-'+th);
    if (!slot) return;
    slot.style.position = 'relative';
    slot.style.overflow = 'visible';
    const line = document.createElement('div');
    line.className = 'day-task-line';
    line.style.top = (tmin/60*CELL_H) + 'px';
    line.innerHTML = `<span class="day-task-label${th === 0 && tmin < 20 ? ' below' : ''}">${escHtml(taskByTime[tm].join('、'))} ${tm}</span>`;
    slot.appendChild(line);
  });

  // Now line
  if (dStr === fmt(TODAY)) {
    const now = new Date();
    const nowH = now.getHours(), nowM = now.getMinutes();
    const slot = document.getElementById('dslot-'+nowH);
    if (slot) {
      slot.style.position = 'relative';
      const line = document.createElement('div');
      line.className = 'day-now-line';
      const timeLabel = String(nowH).padStart(2,'0')+':'+String(nowM).padStart(2,'0');
      line.style.top = (nowM/60*CELL_H) + 'px';
      line.innerHTML = `<div class="day-now-dot"></div><div class="day-now-bar"></div><div class="day-now-time">${timeLabel}</div>`;
      slot.appendChild(line);
    }
    setTimeout(() => {
      const grid = document.getElementById('time-grid-day');
      grid.scrollTop = Math.max(0, nowH * CELL_H - 80);
    }, 50);
  }
}

/* ══════════════════════════
   COLUMN OVERLAP DETECTION
══════════════════════════ */
function toMin(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }
function overlapsTime(s1,e1,s2,e2) { return s1 < e2 && e1 > s2; }

function computeColumns(evts) {
  const timed = evts.filter(e => e.start)
    .sort((a,b) => a.start.localeCompare(b.start));
  const result = new Map();

  for (let i = 0; i < timed.length; i++) {
    const a = timed[i];
    const aS = toMin(a.start);
    const aE = Math.max(aS + 30, a.end ? toMin(a.end) : aS + 30);
    let col = 0;
    for (let j = 0; j < i; j++) {
      const b = timed[j];
      const bS = toMin(b.start);
      const bE = Math.max(bS + 30, b.end ? toMin(b.end) : bS + 30);
      if ((result.get(b.id)||{col:0}).col === 0 && overlapsTime(aS,aE,bS,bE)) {
        col = 1; break;
      }
    }
    result.set(a.id, { col, overlap: false });
  }

  // mark events that have at least one overlap
  for (let i = 0; i < timed.length; i++) {
    const a = timed[i];
    const aS = toMin(a.start);
    const aE = Math.max(aS + 30, a.end ? toMin(a.end) : aS + 30);
    for (let j = 0; j < timed.length; j++) {
      if (i === j) continue;
      const b = timed[j];
      const bS = toMin(b.start);
      const bE = Math.max(bS + 30, b.end ? toMin(b.end) : bS + 30);
      if (overlapsTime(aS,aE,bS,bE)) {
        result.get(a.id).overlap = true; break;
      }
    }
  }
  return result;
}

   EVENT MODAL (ADD/EDIT)
══════════════════════════ */
let editingId = null;
let selectedColor = EVENT_COLORS[4].hex;
let isAllDay = false;

function defaultTimes(timeStr) {
  if (timeStr) {
    const h = parseInt(timeStr.split(':')[0]);
    return { start: timeStr, end: String(Math.min(h + 1, 23)).padStart(2,'0') + ':00' };
  }
  const now = new Date();
  const nextH = Math.min(now.getHours() + 1, 23);
  return {
    start: String(nextH).padStart(2,'0') + ':00',
    end:   String(Math.min(nextH + 1, 23)).padStart(2,'0') + ':00'
  };
}

function setAlldayUI(on) {
  isAllDay = on;
  document.getElementById('allday-toggle').classList.toggle('on', on);
  document.getElementById('time-row').style.display = on ? 'none' : '';
  if (on) {
    document.getElementById('evt-start').value = '';
    document.getElementById('evt-end').value = '';
  }
}

function toggleAllDay() {
  setAlldayUI(!isAllDay);
  if (!isAllDay) {
    const t = defaultTimes(null);
    document.getElementById('evt-start').value = t.start;
    document.getElementById('evt-end').value   = t.end;
  }
}

function buildColorSwatches() {
  const row = document.getElementById('color-swatches');
  row.innerHTML = EVENT_COLORS.map(c =>
    `<div class="color-swatch${c.hex===selectedColor?' selected':''}"
      style="background:${c.hex}" title="${c.name}"
      onclick="pickColor('${c.hex}')"></div>`
  ).join('');
}

function pickColor(hex) {
  selectedColor = hex;
  buildColorSwatches();
}

function onRecurChange() {
  const v = document.getElementById('evt-recur').value;
  document.getElementById('recur-end-row').style.display = v === 'none' ? 'none' : '';
}

function openAddModal(dateStr, timeStr) {
  editingId = null;
  document.getElementById('modal-title-text').textContent = '予定を追加';
  document.getElementById('evt-title').value = '';
  const defaultDate = dateStr || fmt(calCursor);
  document.getElementById('evt-date').value     = defaultDate;
  document.getElementById('evt-date-end').value = defaultDate;
  const noteEl = document.getElementById('evt-note');
  noteEl.value = '';
  noteEl.style.height = '';
  document.getElementById('evt-recur').value = 'none';
  document.getElementById('evt-recur-end').value = '';
  document.getElementById('evt-reminder').value = 'none';
  document.getElementById('recur-end-row').style.display = 'none';
  setAlldayUI(false);
  const t = defaultTimes(timeStr || null);
  document.getElementById('evt-start').value = t.start;
  document.getElementById('evt-end').value   = t.end;
  selectedColor = EVENT_COLORS[4].hex;
  buildColorSwatches();
  document.getElementById('modal-actions').innerHTML =
    `<button class="btn-cancel" onclick="closeModal()">キャンセル</button>
     <button class="btn-save" onclick="saveEvent()">保存</button>`;
  lockScroll();
  document.getElementById('event-modal').classList.add('open');
  setTimeout(() => {
    const inner = document.querySelector('#event-modal .modal-sheet-inner');
    if (inner) inner.scrollTop = 0;
  }, 30);
}

function openEditModal(id) {
  const evt = events.find(e => e.id === id);
  if (!evt) return;
  editingId = id;
  document.getElementById('modal-title-text').textContent = '予定を編集';
  document.getElementById('evt-title').value = evt.title;
  document.getElementById('evt-date').value = evt.date;
  document.getElementById('evt-date-end').value = evt.dateEnd || '';
  const noteEl2 = document.getElementById('evt-note');
  noteEl2.value = evt.note || '';
  noteEl2.style.height = '';
  if (evt.note) { noteEl2.style.height = noteEl2.scrollHeight + 'px'; }
  document.getElementById('evt-recur').value = evt.recur || 'none';
  document.getElementById('evt-recur-end').value = evt.recurEnd || '';
  document.getElementById('evt-reminder').value = evt.reminder || 'none';
  document.getElementById('recur-end-row').style.display = (evt.recur && evt.recur !== 'none') ? '' : 'none';
  const allDay = !evt.start;
  setAlldayUI(allDay);
  if (!allDay) {
    document.getElementById('evt-start').value = evt.start || '';
    document.getElementById('evt-end').value   = evt.end   || '';
  }
  selectedColor = evt.color;
  buildColorSwatches();
  document.getElementById('modal-actions').innerHTML =
    `<button class="btn-cancel" onclick="closeModal()">キャンセル</button>
     <button class="btn-save" onclick="saveEvent()">保存</button>`;
  closeDetail();
  lockScroll();
  document.getElementById('event-modal').classList.add('open');
  setTimeout(() => {
    const inner = document.querySelector('#event-modal .modal-sheet-inner');
    if (inner) inner.scrollTop = 0;
  }, 30);
}

function lockScroll()   { document.body.style.overflow = 'hidden'; }
function unlockScroll() { document.body.style.overflow = ''; }

function closeModal() {
  document.getElementById('event-modal').classList.remove('open');
  unlockScroll();
}

function saveEvent() {
  const title = document.getElementById('evt-title').value.trim();
  if (!title) { document.getElementById('evt-title').focus(); return; }
  const date     = document.getElementById('evt-date').value;
  const start    = document.getElementById('evt-start').value;
  const end      = document.getElementById('evt-end').value;
  const note     = document.getElementById('evt-note').value.trim();
  const recur    = document.getElementById('evt-recur').value;
  const recurEnd = document.getElementById('evt-recur-end').value;
  const reminder = document.getElementById('evt-reminder').value;
  if (!date) { document.getElementById('evt-date').focus(); return; }

  const dateEnd  = document.getElementById('evt-date-end').value;
  const evtData = { title, date, dateEnd, start, end, note, color: selectedColor, recur, recurEnd, reminder };

  if (editingId) {
    const idx = events.findIndex(e => e.id === editingId);
    if (idx !== -1) events[idx] = { id: editingId, ...evtData };
  } else {
    events.push({ id: Date.now().toString(), ...evtData });
  }
  persist();
  closeModal();
  renderCurrentView();
  scheduleReminders();
}

function openSearch() {
  lockScroll();
  document.getElementById('search-modal').classList.add('open');
  setTimeout(() => document.getElementById('search-input').focus(), 250);
}

function closeSearch() {
  document.getElementById('search-modal').classList.remove('open');
  unlockScroll();
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').innerHTML = '<div class="search-empty">キーワードを入力してください</div>';
}

function onSearchInput() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const res = document.getElementById('search-results');
  if (!q) {
    res.innerHTML = '<div class="search-empty">キーワードを入力してください</div>';
    return;
  }
  const evtResults = events.filter(e =>
    e.title.toLowerCase().includes(q) || (e.note||'').toLowerCase().includes(q)
  );
  const diaryResults = Object.entries(diaries).filter(([,v]) =>
    v.text.toLowerCase().includes(q)
  ).sort((a,b) => b[0].localeCompare(a[0]));
  const memoResults = memos.map((m,i) => ({m,i})).filter(({m}) =>
    (m.title||'').toLowerCase().includes(q) ||
    (m.body||'').toLowerCase().includes(q) ||
    (m.checks||[]).some(c => c.text.toLowerCase().includes(q))
  );
  if (!evtResults.length && !diaryResults.length && !memoResults.length) {
    res.innerHTML = `<div class="search-empty">「${escHtml(q)}」に一致する結果はありません</div>`;
    return;
  }
  let html = '';
  if (evtResults.length) {
    html += `<div class="search-section-title">予定 (${evtResults.length}件)</div>`;
    html += evtResults.map(e => `
      <div class="search-item" onclick="closeSearch();calCursor=parseDateStr('${e.date}');setView('day');setTimeout(()=>showDetail('${e.id}','${e.date}'),100)">
        <div class="search-item-title"><span style="width:8px;height:8px;border-radius:50%;background:${e.color};flex-shrink:0;display:inline-block"></span>${escHtml(e.title)}</div>
        <div class="search-item-sub">${dayLabel(e.date)}${e.start?' '+e.start:''}</div>
      </div>`).join('');
  }
  if (diaryResults.length) {
    html += `<div class="search-section-title">日記 (${diaryResults.length}件)</div>`;
    html += diaryResults.map(([k,v]) => `
      <div class="search-item" onclick="closeSearch();switchTab('diary')">
        <div class="search-item-title">${dayLabel(k)}</div>
        <div class="search-item-sub">${escHtml(v.text.slice(0,60))}${v.text.length>60?'…':''}</div>
      </div>`).join('');
  }
  if (memoResults.length) {
    html += `<div class="search-section-title">メモ (${memoResults.length}件)</div>`;
    html += memoResults.map(({m}) => `
      <div class="search-item" onclick="closeSearch();switchTab('memo')">
        <div class="search-item-title">${escHtml(m.title||'無題')}</div>
        ${m.body?`<div class="search-item-sub">${escHtml(m.body.slice(0,60))}${m.body.length>60?'…':''}</div>`:''}
      </div>`).join('');
  }
  res.innerHTML = html;
}

function openSettings() {
  lockScroll();
  document.getElementById('settings-modal').classList.add('open');
}

  document.getElementById('settings-modal').classList.remove('open');
  unlockScroll();
}

function exportData() {
  const data = { events, diaries, memos, tasks: Tasks.getTasks(), exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mydiary-backup-' + fmt(new Date()) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm('現在のデータを上書きしてインポートしますか？\n※この操作は元に戻せません')) return;
      if (Array.isArray(data.events))  events  = data.events;
      if (data.diaries && typeof data.diaries === 'object') diaries = data.diaries;
      if (Array.isArray(data.memos))   memos   = data.memos;
      if (Array.isArray(data.tasks))   Tasks.setTasks(data.tasks);
      persist();
      renderCurrentView();
      closeSettings();
      alert('インポートが完了しました');
    } catch(err) {
      alert('ファイルの読み込みに失敗しました。正しいバックアップファイルか確認してください。');
    }
  };
  reader.readAsText(file);
  input.value = '';
}
